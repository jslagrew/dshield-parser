name: Enrichment tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  enrichment:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with optional local database reader
        run: python -m pip install ".[geoip]" build
      - name: Run offline enrichment regression tests
        run: python -m unittest discover -s dshield_parser/test -p "test_enrichment*.py" -v
      - name: Build distribution
        run: python -m build
