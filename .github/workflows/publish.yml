name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"   # triggers on tags like v1.0.0, v1.2.3, etc.

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write  # required for trusted publishing (no API token needed)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          python -m pip install ".[geoip]"

      - name: Verify release tag and offline enrichment tests
        run: |
          python -c "import os, dshield_parser; expected = 'v' + dshield_parser.__version__; actual = os.environ['GITHUB_REF_NAME']; assert actual == expected, f'Tag {actual} does not match package {expected}'"
          python -m unittest discover -s dshield_parser/test -p "test_enrichment*.py" -v

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

